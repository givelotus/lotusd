# lotusd: -logformat=json -debuglogfile=/var/log/lotus/debug.jsonl
server:
  http_listen_port: 9080
  grpc_listen_port: 0
positions:
  filename: /var/lib/promtail/positions.yaml
clients:
  - url: http://127.0.0.1:3100/loki/api/v1/push
scrape_configs:
  - job_name: lotus
    static_configs:
      - targets: [localhost]
        labels:
          job: lotus
          __path__: /var/log/lotus/debug.jsonl
    pipeline_stages:
      - json:
          expressions:
            level: level
            category: category
            time: time
      - labels:
          level:
          category:
      - timestamp:
          source: time
          format: RFC3339Nano
